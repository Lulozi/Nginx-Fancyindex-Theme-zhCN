        <meta name="color-scheme" content="light dark">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self';">
        <title>文件目录</title>
        <script>
            (function(){
                'use strict';
                try {
                    var key = 'fancyindex-theme';
                    var stored = null;
                    try { stored = localStorage.getItem(key); } catch (e) {}
                    var theme = stored || 'auto';
                    var isDark = false;
                    if (theme === 'dark') {
                        isDark = true;
                    } else if (theme === 'auto') {
                        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = true;
                    }
                    if (isDark) {
                        document.documentElement.classList.add('theme-dark');
                    } else {
                        document.documentElement.classList.add('theme-light');
                    }
                } catch (e) {}
            })();
        </script>
